<!--
  Shared icon set for demos. 24x24, 1.75 stroke, currentColor, no fills.

  This exists because emoji were being used as UI icons in two demos, and an
  emoji is not an icon: it renders in a different typeface on every OS, it
  carries its own colour that fights the palette, it sits on a text baseline
  rather than an optical centre, and at demo capture sizes it turns to mush.
  The linter has an `emoji` error for exactly this. Replace the emoji, keep
  the meaning.

  Use as a sprite:

      <svg class="icon" aria-hidden="true"><use href="icons.svg#alert"/></svg>

      .icon { width: 1em; height: 1em; stroke: currentColor; fill: none;
              stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
              vertical-align: -0.125em; }

  Colour comes from the surrounding text, so a warn-coloured label gets a
  warn-coloured icon for free and the icon can never drift from the palette. An icon that
  sits beside a text label is decorative: mark it `aria-hidden="true"`. An icon
  that *is* the content needs a `<title>` or an `aria-label` on the <svg>.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- state -->
  <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4"/><circle cx="12" cy="17.2" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="siren" viewBox="0 0 24 24"><path d="M5 18v-5a7 7 0 0 1 14 0v5"/><path d="M3 18h18v3H3z"/><path d="M12 2v2M4 6 2.6 4.6M20 6l1.4-1.4"/></symbol>
  <symbol id="blocked" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="hourglass" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12"/><path d="M7 3v3.5c0 2 5 3.7 5 5.5s-5 3.5-5 5.5V21"/><path d="M17 3v3.5c0 2-5 3.7-5 5.5s5 3.5 5 5.5V21"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>

  <!-- capture and inspection -->
  <symbol id="camera" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.2" r="3.4"/></symbol>
  <symbol id="video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="1.5"/><path d="m15 10.5 6-3.5v10l-6-3.5z"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></symbol>
  <symbol id="scan" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M4 12h16"/></symbol>
  <symbol id="clipboard" viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M15 5.5h2.5A1.5 1.5 0 0 1 19 7v12a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V7a1.5 1.5 0 0 1 1.5-1.5H9"/><path d="M9 12h6M9 16h4"/></symbol>

  <!-- data and signal -->
  <symbol id="chart-bar" viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 20v-6M12.5 20V8M17 20v-9"/></symbol>
  <symbol id="trend-up" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
  <symbol id="trend-down" viewBox="0 0 24 24"><path d="m3 7 6 6 4-4 8 8"/><path d="M15 17h6v-6"/></symbol>
  <symbol id="signal" viewBox="0 0 24 24"><path d="M4 20v-3M9.3 20v-7M14.7 20v-11M20 20V6"/></symbol>
  <symbol id="database" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></symbol>
  <symbol id="save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
  <symbol id="package" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></symbol>

  <!-- infrastructure -->
  <symbol id="cloud" viewBox="0 0 24 24"><path d="M7 18.5a4 4 0 0 1-.4-8A5.5 5.5 0 0 1 17.3 10a3.8 3.8 0 0 1 .2 8.5Z"/></symbol>
  <symbol id="bolt" viewBox="0 0 24 24"><path d="M13.5 3 5 13.8h5.8L10 21l8.6-10.8h-5.9L13.5 3Z"/></symbol>
  <symbol id="wrench" viewBox="0 0 24 24"><path d="M15.6 3.6a5.5 5.5 0 0 0-6.9 7l-5 5a1.8 1.8 0 0 0 2.5 2.5l5-5a5.5 5.5 0 0 0 7-6.9l-3.2 3.2-2.7-.6-.6-2.7 3.2-3.2Z"/></symbol>
  <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7M4 20v-4.7h4.7"/></symbol>
  <symbol id="link" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7 0l2.8-2.8a4 4 0 0 0-5.7-5.7L11.4 6.4"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-2.8 2.8a4 4 0 0 0 5.7 5.7l1.4-1.4"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="1.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></symbol>

  <!-- people and messages -->
  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.2a3.5 3.5 0 0 1 0 6.6M17.5 20a6 6 0 0 0-2.2-4.6"/></symbol>
  <symbol id="message" viewBox="0 0 24 24"><path d="M20 5v10a1.5 1.5 0 0 1-1.5 1.5H9L4.5 20V6.5A1.5 1.5 0 0 1 6 5h12.5A1.5 1.5 0 0 1 20 5Z"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M18 16V11a6 6 0 0 0-12 0v5l-1.5 2.5h15L18 16Z"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0"/></symbol>
  <symbol id="cost" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6.5v11"/><path d="M14.8 9.4a2.9 2.9 0 0 0-2.8-1.6c-1.7 0-2.9.9-2.9 2.2 0 3 5.8 1.6 5.8 4.6 0 1.4-1.3 2.3-3 2.3a3 3 0 0 1-2.9-1.7"/></symbol>

</svg>
