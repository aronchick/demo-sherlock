<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherlock · edge to cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171c23; --panel: #1f2630; --line: #2d3744;
    --ink: #e9edf1; --dim: #8894a3;
    --scout: #6fb1e6; --director: #e8a33d; --analyst: #8fd19e; --verifier: #f08c8c;
    --weapon: #ff7a59; --benign: #7f8b99; --ok: #8fd19e; --bad: #f08c8c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.4 "IBM Plex Sans", sans-serif; }
  .stage { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr) auto;
    gap: 10px; padding: 12px 14px; }
  header { display: flex; align-items: baseline; gap: 16px; min-width: 0; }
  header h1 { margin: 0; font: 600 22px "IBM Plex Sans Condensed", sans-serif; letter-spacing: .02em; }
  header .sub { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .ratio { margin-left: auto; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  header .ratio b { font: 500 34px/1 "IBM Plex Mono", monospace; color: var(--ink); font-variant-numeric: tabular-nums; }
  header .ratio span { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap: 12px; min-height: 0; }
  .left { display: grid; grid-template-rows: minmax(0,1.7fr) minmax(0,1fr); gap: 12px; min-height: 0; }
  .frame { position: relative; background: #000; border-radius: 8px; overflow: hidden; min-height: 0; border: 1px solid var(--line); transition: border-color .3s, box-shadow .3s; }
  .frame.alert { border-color: var(--weapon); box-shadow: 0 0 0 1px var(--weapon), 0 0 28px rgba(255,122,89,.35); animation: alertpulse 1.2s ease-in-out 3; }
  @keyframes alertpulse { 50% { box-shadow: 0 0 0 1px var(--weapon), 0 0 48px rgba(255,122,89,.6); } }
  .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .frame .tag { position: absolute; left: 10px; top: 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); background: rgba(23,28,35,.7); padding: 3px 7px; border-radius: 4px; }
  .frame .tag i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--scout); margin-right: 6px; vertical-align: 0; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .frame .cover { position: absolute; inset: 0; background: rgba(10,12,15,.88); display: none; align-items: center; justify-content: center;
    color: var(--dim); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .frame.covered .cover { display: flex; }
  #wideFrame .tag { top: auto; bottom: 8px; }
  #wideFrame .stamp { top: auto; bottom: 10px; }
  #cropFrame img { transition: transform .55s cubic-bezier(.2,.8,.2,1), filter .55s; transform-origin: center; }
  #cropFrame.iris img { transform: scale(1.5); filter: blur(5px); transition: none; }
  #cropFrame.sealed img { filter: blur(14px) saturate(.4); }
  #cropFrame.flash::after, #wideFrame.flash::after { content: ""; position: absolute; inset: 0; background: #fff; animation: flash .45s ease-out forwards; pointer-events: none; }
  @keyframes flash { from { opacity: .55; } to { opacity: 0; } }
  .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; font-size: 13px; color: var(--ink);
    background: linear-gradient(transparent, rgba(23,28,35,.92)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s; }
  .caption.on { opacity: 1; }
  .stamp { position: absolute; right: 12px; top: 10px; padding: 4px 10px; border: 2px solid; border-radius: 4px;
    font: 600 12px "IBM Plex Sans Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase;
    opacity: 0; transform: rotate(-8deg) scale(1.6); transition: opacity .25s, transform .25s cubic-bezier(.2,1.4,.4,1); }
  .stamp.on { opacity: 1; transform: rotate(-8deg) scale(1); }
  .stamp.ok { color: var(--ok); border-color: var(--ok); } .stamp.bad { color: var(--bad); border-color: var(--bad); }
  .stamp.alert { color: var(--weapon); border-color: var(--weapon); font-size: 15px; }
  .stamp.quiet { color: var(--benign); border-color: var(--benign); }
  .topo { position: relative; border-radius: 8px; min-height: 0; border: 1px solid var(--line); background: var(--panel); }
  footer { display: flex; align-items: center; gap: 8px; min-width: 0; }
  footer .stat { color: var(--dim); font-size: 12px; white-space: nowrap; }
  footer .stat b { color: var(--ink); font-weight: 500; font-family: "IBM Plex Mono", monospace; }
  footer .sp { flex: 1; }
  footer a { color: var(--dim); font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--line); }
  button { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--director); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--director); outline-offset: 2px; }
  #fx { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Sherlock</h1>
    <div class="sub">one 10 ms model watches everything; the cloud only ever sees a crop</div>
    <div class="ratio"><b id="avoided">0</b><span>VLM calls avoided</span></div>
  </header>
  <main>
    <div class="left">
      <div class="frame" id="wideFrame">
        <img id="wide" src="/stream/wide" alt="Live wide view">
        <span class="tag"><i></i>live · laptop</span>
        <div class="stamp" id="wideStamp">alert</div>
        <div class="cover">lens covered</div>
      </div>
      <div class="frame" id="cropFrame">
        <img id="crop" src="/stream/crop" alt="Zoomed crop">
        <span class="tag" id="cropTag">zoom</span>
        <div class="stamp" id="stamp">confirmed</div>
        <div class="caption" id="caption"></div>
      </div>
    </div>
    <div class="topo" id="topo"></div>
  </main>
  <footer>
    <span class="stat">frames <b id="frames">0</b></span>
    <span class="stat">investigations <b id="investigations">0</b></span>
    <span class="stat">VLM calls <b id="vlm_calls">0</b></span>
    <span class="stat">alerts <b id="alerts">0</b></span>
    <span class="stat">ignored <b id="ignored">0</b></span>
    <span class="stat">recovered <b id="recoveries">0</b></span>
    <span class="stat">verified <b id="confirmed">0</b> / <b id="rejected">0</b></span>
    <span class="sp"></span>
    <a href="/">event log</a>
    <button onclick="post('/demo/fail/1')">Break next tool call</button>
    <button id="coverBtn" onclick="toggleCover()">Cover hero lens</button>
  </footer>
</div>
<canvas id="fx"></canvas>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Driven entirely by the existing SSE stream. Events arrive in bursts (mock
// tools answer in a few ms), so each one becomes a "beat" played back at a pace
// a human can follow. Nothing here hardcodes the tool chain: each tool event is
// read for what it is (data.tool, data.result, the bbox in the message), so a
// benign ignore, a weapon chain with a face crop, or an unknown object all play
// out from the stream. Pixels for the flying cards come from the MJPEG <img>
// elements via drawImage, so what moves through the topology is the real crop.
// What crosses the laptop/cloud line: a metadata ticket to the Director, and
// the zoomed crop(s) to the Analyst. The face crop is sealed straight into the
// bucket: stored evidence, never analyzed, never labelled.
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const fx = $('fx'), ctx = fx.getContext('2d');
const wideImg = $('wide'), cropImg = $('crop');
const C = { scout: '#6fb1e6', director: '#e8a33d', analyst: '#8fd19e', verifier: '#f08c8c', weapon: '#ff7a59', benign: '#7f8b99',
  bad: '#f08c8c', dim: '#8894a3', ink: '#e9edf1', local: 'rgba(111,177,230,.45)' };
const threatColor = t => t === 'weapon' ? C.weapon : t === 'benign' ? C.benign : C.scout;

// ---- layout ----------------------------------------------------------------
const NODE_DEFS = [
  { id: 'scout',    fx: 0.24, fy: 0.16,  label: 'scout',    sub: 'YOLO nano · 10 ms',   color: C.scout },
  { id: 'camera',   fx: 0.24, fy: 0.52,  label: 'camera',   sub: 'pan · tilt · zoom',    color: C.scout },
  { id: 'director', fx: 0.75, fy: 0.16,  label: 'director', sub: 'Nemotron · decides',   color: C.director },
  { id: 'analyst',  fx: 0.75, fy: 0.52,  label: 'analyst',  sub: 'VLM · reads the crop', color: C.analyst },
  { id: 'verifier', fx: 0.75, fy: 0.74,  label: 'verifier', sub: 'VLM · second opinion', color: C.verifier },
  { id: 'bucket',   fx: 0.75, fy: 0.925, label: 'bucket',   sub: 'S3 · evidence',        color: C.dim, shelf: true },
];
const EDGE_DEFS = {
  frames:  { from: 'camera',   to: 'scout',    bend: 0,     color: C.local },
  uplink:  { from: 'scout',    to: 'director', bend: -0.12, color: C.scout },
  lookat:  { from: 'director', to: 'camera',   bend: 0.18,  color: C.director },
  crop:    { from: 'camera',   to: 'analyst',  bend: 0.10,  color: C.analyst },
  seal:    { from: 'camera',   to: 'bucket',   bend: 0.22,  color: C.dim },
  judge:   { from: 'analyst',  to: 'verifier', bend: 0,     color: C.verifier },
  store:   { from: 'verifier', to: 'bucket',   bend: 0,     color: C.dim },
};
const L = { nodes: {}, edges: {}, r: 26, topo: null, divider: 0, shelf: null };

function layout() {
  const dpr = window.devicePixelRatio || 1;
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
  fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = $('topo').getBoundingClientRect();
  L.topo = t;
  L.r = Math.max(18, Math.min(30, t.width * 0.058));
  L.divider = t.left + t.width * 0.495;
  for (const n of NODE_DEFS) L.nodes[n.id] = { ...n, x: t.left + t.width * n.fx, y: t.top + t.height * n.fy, glow: 0, tint: null, badge: null };
  L.shelf = { w: Math.min(t.width * 0.42, 260), h: L.r * 2.1 };
  L.nodes.bucket.y = t.top + t.height - L.shelf.h / 2 - 14;
  for (const [k, e] of Object.entries(EDGE_DEFS)) {
    const a = L.nodes[e.from], c = L.nodes[e.to];
    const mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
    const dx = c.x - a.x, dy = c.y - a.y, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    L.edges[k] = { ...e, ax: a.x, ay: a.y, cx: mx + nx * e.bend * len, cy: my + ny * e.bend * len, bx: c.x, by: c.y, len, hot: 0, tint: null };
  }
}
addEventListener('resize', layout);

function edgePoint(e, t) {
  const u = 1 - t;
  return { x: u * u * e.ax + 2 * u * t * e.cx + t * t * e.bx, y: u * u * e.ay + 2 * u * t * e.cy + t * t * e.by };
}
function trimmed(e, t) { const pad = (L.r + 4) / e.len; return edgePoint(e, pad + t * (1 - 2 * pad)); }

// ---- video geometry ----------------------------------------------------------
function imgMap(img) {
  const r = img.getBoundingClientRect();
  const nw = img.naturalWidth || 1280, nh = img.naturalHeight || 720;
  const s = Math.min(r.width / nw, r.height / nh);
  return { s, ox: r.left + (r.width - nw * s) / 2, oy: r.top + (r.height - nh * s) / 2, nw, nh, r };
}
function bboxToPage(img, bb) {
  const m = imgMap(img);
  return { x: m.ox + bb[0] * m.s, y: m.oy + bb[1] * m.s, w: (bb[2] - bb[0]) * m.s, h: (bb[3] - bb[1]) * m.s };
}
// Same zoom rule as FakePTZCamera.bbox_to_pose: the crop is the frame shrunk by the zoom factor.
function zoomWindow(bb, nw, nh) {
  const bw = Math.max(bb[2] - bb[0], 1), bh = Math.max(bb[3] - bb[1], 1);
  const z = Math.max(1, Math.min(4, 0.8 * Math.min(nw / bw, nh / bh)));
  const cw = nw / z, ch = nh / z, cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
  const x0 = Math.min(Math.max(cx - cw / 2, 0), nw - cw), y0 = Math.min(Math.max(cy - ch / 2, 0), nh - ch);
  return [x0, y0, x0 + cw, y0 + ch];
}
function grab(img, bb, size = 160) {
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return null;
  let [x1, y1, x2, y2] = bb || [0, 0, nw, nh];
  const padx = (x2 - x1) * 0.15, pady = (y2 - y1) * 0.15;
  x1 = Math.max(0, x1 - padx); y1 = Math.max(0, y1 - pady); x2 = Math.min(nw, x2 + padx); y2 = Math.min(nh, y2 + pady);
  const w = x2 - x1, h = y2 - y1, k = size / Math.max(w, h);
  const c = document.createElement('canvas'); c.width = Math.max(2, Math.round(w * k)); c.height = Math.max(2, Math.round(h * k));
  try { c.getContext('2d').drawImage(img, x1, y1, w, h, 0, 0, c.width, c.height); } catch (e) { return null; }
  return c;
}

// ---- animated state ----------------------------------------------------------
const S = {
  particles: [], cards: [], bursts: [], shelf: [],
  boxes: [],        // [{ bb, color, alpha, dash, label }] on the wide feed
  zoom: null, docked: null,
  frames: 0, ambient: 0.6, latency: {},
};
const now = () => performance.now();
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const wait = ms => new Promise(r => setTimeout(r, ms));

function flow(edge, ms, color) {
  const e = L.edges[edge];
  e.hot = Math.max(e.hot, now() + ms);
  e.tint = color || null;
  for (let i = 0; i < 6; i++) spawnParticle(e, Math.random() * 0.15);
}
function spawnParticle(e, t0 = 0) {
  S.particles.push({ e, t: t0, v: 0.0045 + Math.random() * 0.004, j: (Math.random() - .5) * 10, size: 1.2 + Math.random() * 1.8 });
}
function burst(x, y, color, n = 26) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3;
    S.bursts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, a: 1, color, size: 1.5 + Math.random() * 2 });
  }
}
function glow(id, amount = 1, tint) { const n = L.nodes[id]; n.glow = Math.max(n.glow, amount); n.tint = tint || null; }
function badge(id, text, color, ms = 2600) { const n = L.nodes[id]; n.badge = { text, color, until: now() + ms }; }
function latency(id, ms) { if (ms) S.latency[id] = { ms: Math.round(ms), t: now() }; }
function nodeXY(id) { const n = L.nodes[id]; return { x: n.x, y: n.y }; }
function centerOf(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function sendCard(bmp, points, ms, o = {}) {
  return new Promise(res => S.cards.push({ bmp, pts: points, t0: now(), ms, w: o.w || 64, done: res,
    text: o.text || null, color: o.color || C.ink, blur: !!o.blur, stamp: o.stamp === undefined ? null : o.stamp }));
}
function flash(el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function setStamp(el, text, cls) { el.textContent = text; el.className = 'stamp' + (cls ? ' on ' + cls : ''); }
function caption(text) { const c = $('caption'); c.textContent = text; c.classList.toggle('on', !!text); }
function shelfSlot(i) {
  const b = L.nodes.bucket, sh = L.shelf, cell = (sh.w - 16) / 8;
  return { x: b.x - sh.w / 2 + 8 + cell * i + cell / 2, y: b.y, w: cell - 4, h: sh.h - 14 };
}
function shelve(item) {
  S.shelf.push(item);
  if (S.shelf.length > 8) S.shelf.shift();
}
// Stored evidence, when the server exposes it, replaces the client grab (progressive; 404 is fine).
function loadEvidence(item, incident, name) {
  if (!incident || !name) return;
  const img = new Image();
  img.onload = () => { item.bmp = img; };
  img.src = `/evidence/${encodeURIComponent(incident)}/${name}.jpg`;
}

// ---- beats: the choreography queue --------------------------------------------
const Q = []; let playing = false;
function beat(fn) { Q.push(fn); if (!playing) drain(); }
async function drain() {
  playing = true;
  while (Q.length) { try { await Q.shift()(); } catch (e) { console.error(e); } }
  playing = false;
}

// Per-incident memory, filled from events only.
let cur = { bb: null, head: null, threat: 'unknown', label: '', color: C.scout, card: null, crop: null, face: null, verdict: null, looks: 0 };

function toolName(ev) { return (ev.data && ev.data.tool) || ((ev.msg || '').match(/^([a-z_]+)/) || [])[1] || ''; }
function bboxIn(ev) {
  const d = ev.data || {};
  if (Array.isArray(d.bbox) && d.bbox.length === 4) return d.bbox;
  const m = (ev.msg || '').match(/bbox=\[([^\]]+)\]/);
  return m ? m[1].split(',').map(Number) : null;
}
const same = (a, b) => a && b && a.every((v, i) => Math.abs(v - b[i]) < 2);

let pendingScout = null;
function onScout(ev) {
  const d = ev.data || {};
  if (!d.bbox) return;
  // The second camera reports the same object a few ms later and the orchestrator
  // drops it as a duplicate; hold the beat so a dropped detection never lifts a card.
  if (pendingScout) { clearTimeout(pendingScout.timer); playScout(pendingScout.ev); }   // a new one flushes the last
  pendingScout = { ev, key: `${d.label} on ${d.camera}`, timer: setTimeout(() => { pendingScout = null; playScout(ev); }, 150) };
}
function playScout(ev) {
  const d = ev.data || {};
  const bb = d.bbox;
  const threat = d.threat || 'unknown', color = threatColor(threat);
  beat(async () => {
    cur = { bb, head: d.head || null, person: d.person || null, threat, label: d.label || '', color,
      card: grab(wideImg, bb), crop: null, face: null, verdict: null, looks: 0, incident: null };
    S.boxes = [{ bb, color, alpha: 1, label: (d.label || '').toUpperCase(), weight: threat === 'weapon' ? 2.5 : 2 }];
    if (d.person) S.boxes.push({ bb: d.person, color: hexA(C.ink, .55), alpha: 1, weight: 1 });
    if (d.head) S.boxes.push({ bb: d.head, color: C.director, alpha: 1, dash: true, weight: 1 });
    S.zoom = null; S.docked = null;
    flash($('wideFrame')); $('wideFrame').classList.remove('alert');
    setStamp($('stamp'), '', ''); setStamp($('wideStamp'), '', ''); caption('');
    $('cropFrame').classList.remove('sealed'); $('cropTag').textContent = 'zoom';
    glow('scout', 1, color); latency('scout', ev.latency_ms);
    const p = bboxToPage(wideImg, bb);
    const dock = { x: L.nodes.scout.x - L.r - 34, y: L.nodes.scout.y };
    await sendCard(cur.card, [{ x: p.x + p.w / 2, y: p.y + p.h / 2 }, dock], 650, { w: 72, color });
    S.docked = { bmp: cur.card, ...dock, alpha: 1, color };            // the pixels stay on the laptop
    burst(L.nodes.scout.x, L.nodes.scout.y, color, 14);
  });
  beat(async () => {                                                    // only a ticket crosses the line
    flow('uplink', 850, color);
    glow('director', 0.6);
    await sendCard(null, [nodeXY('scout'), edgePoint(L.edges.uplink, 0.5), nodeXY('director')], 900,
      { text: `${cur.label || 'object'} · ${threat}`, color });
    glow('director', 1);
  });
}
function onDirector(ev) {
  const m = ev.msg || '';
  beat(async () => {
    glow('director', 1); latency('director', ev.latency_ms);
    if (/benign/i.test(m) && /ignore/i.test(m)) badge('director', 'ignore', C.benign);
    if (/recovering|failed|unreachable|budget/i.test(m)) burst(L.nodes.director.x, L.nodes.director.y, C.bad, 20);
    await wait(/->|look_at|snapshot/i.test(m) ? 350 : 500);
  });
}
function onTool(ev) {
  const m = ev.msg || '', name = toolName(ev), d = ev.data || {};
  if (/refused/i.test(m)) {                                             // benign: the snapshot is refused, no VLM call
    beat(async () => { badge('camera', 'no VLM call', C.benign); glow('camera', .6, C.benign); await wait(500); });
    return;
  }
  if (/FAILED|error|corrupted/i.test(m)) {
    beat(async () => {
      const where = name === 'snapshot' ? 'analyst' : name === 'verify' ? 'verifier' : 'camera';
      const e = name === 'snapshot' ? L.edges.crop : L.edges.lookat;
      const p = edgePoint(e, 0.55);
      burst(p.x, p.y, /corrupted/i.test(m) ? C.director : C.bad, 40);
      glow(where, 1, C.bad); badge(where, /corrupted/i.test(m) ? 'bad args' : 'failed', C.bad, 1800);
      for (const b of S.boxes) b.flashColor = C.bad;
      await wait(800);
      for (const b of S.boxes) b.flashColor = null;
      L.nodes[where].tint = null;
    });
    return;
  }
  if (name === 'look_at') {
    const bb = bboxIn(ev) || (cur.looks === 0 ? cur.bb : cur.head);
    beat(async () => {
      const isHead = cur.head && same(bb, cur.head);
      cur.looks++;
      flow('lookat', 800, C.director); latency('camera', ev.latency_ms);
      await wait(380);
      glow('camera', 1, C.director);
      const mm = imgMap(wideImg);

// ---- SSE ----------------------------------------------------------------------
const es = new EventSource('/events');
es.onmessage = e => {
  const ev = JSON.parse(e.data), m = ev.msg || '';
  switch (ev.stage) {
    case 'scout': return onScout(ev);
    case 'director': return onDirector(ev);
    case 'tool': return onTool(ev);
    case 'analyst': return onAnalyst(ev);
    case 'verifier': return onVerifier(ev);
    case 'system':
      if (m.startsWith('REPORT')) return onReport(ev);

      if (/will fail|corrupted arguments/.test(m)) { glow('camera', 1, C.bad); badge('camera', /fail/.test(m) ? 'armed: fail' : 'armed: garbage', C.bad, 1500); }
      if (/already handled/.test(m)) {

};
let lastFrames = 0;
es.addEventListener('stats', e => {
  const s = JSON.parse(e.data);

  $('avoided').textContent = s.vlm_calls_avoided;
  const d = s.frames - lastFrames; lastFrames = s.frames;

});
const post = url => fetch(url, { method: 'POST' });
let covered = false;
async function toggleCover() {

  $('coverBtn').textContent = covered ? 'Uncover hero lens' : 'Cover hero lens';
}

// ---- render loop ----------------------------------------------------------------
function hexA(hex, a) {

function drawTopo(t) {

  ctx.font = '600 10px "IBM Plex Sans"'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = C.dim;
  ctx.fillText('L A P T O P', (T.left + L.divider) / 2, T.top + 10);
  ctx.fillText('C L O U D', (L.divider + T.right) / 2, T.top + 10);
  ctx.save(); ctx.translate(L.divider, (T.top + T.bottom) / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = 'rgba(233,237,241,.4)'; ctx.font = '500 9px "IBM Plex Mono"';
  ctx.fillText('crops only · never the frame', 0, -4); ctx.restore();

    const hot = e.hot > t;
    ctx.strokeStyle = hot ? e.tint || e.color : 'rgba(233,237,241,.09)'; ctx.lineWidth = hot ? 1.4 : 1;
    ctx.globalAlpha = hot ? 0.55 : 1;

    ctx.stroke(); ctx.globalAlpha = 1;

function drawBadge(n, t) {
