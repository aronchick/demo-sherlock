# Ablation 1 (Baseline / Improved): Director = Nemotron 3.5 Lightning (thinking off), system_v2, verbose tools
# Generative parameters by model card: 30B (Nemotron-3.5-Lightning-30B-A3B) + 2.25B (SmolVLM-Instruct) = 32.25B <= 33B.
# By checkpoint tensor count: 31.58B (MTP excluded, never loaded) + 2.25B = 33.82B, over the 33B cap.
# The budget fields below use the model-card figures (see README "Parameter budget and speculation").
sherlock:
  resources_servers:
    sherlock:
      entrypoint: app.py
      domain: agent
      verified: true
      datasets:
        - name: sherlock_ablation_eval
          type: example
          jsonl_fpath: gym/resources_servers/sherlock/data/tasks.jsonl
          num_repeats: 1

policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${oc.env:DIRECTOR_BASE_URL,http://127.0.0.1:18900/v1}
      api_key: ${oc.env:DIRECTOR_API_KEY,EMPTY}
      model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
      return_token_id_information: false
      uses_reasoning_parser: false
      chat_template_kwargs:
        enable_thinking: false
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

sherlock_agent:
  responses_api_agents:
    sherlock_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: sherlock
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 6
      weapon_extra_steps: 4
      prompt_config: gym/prompts/system_v2.yaml
      tool_descriptions: verbose
      ablation_id: nemotron_lightning
      ablation_component: "Model + Prompt v2 + Verbose Tools + Thinking Off (Reference)"
      ablation_description: "Nemotron 3.5 Lightning 30B-A3B (thinking off), system_v2 prompt, verbose tool schemas"
      endpoint_env_var: DIRECTOR_BASE_URL
      director_model_name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
      director_params_b: 30.0
      vlm_model_name: HuggingFaceTB/SmolVLM-Instruct
      vlm_params_b: 2.246
