# Ablation 5 (Prompt Swap): prompt_config=system_v1.yaml vs system_v2.yaml
# Generative parameters by model card: 30B (Nemotron-3.5-Lightning-30B-A3B) + 0.51B (SmolVLM-500M-Instruct) = 30.51B <= 33B.
# By checkpoint tensor count: 31.58B (MTP excluded, never loaded) + 0.51B = 32.09B <= 33B.
# The budget fields below use the model-card figures (see README "Parameter budget and speculation").
sherlock:
  resources_servers:
    sherlock:
      entrypoint: app.py
      domain: agent
      verified: true
      datasets:
        - name: sherlock_ablation_eval
          type: example
          jsonl_fpath: gym/resources_servers/sherlock/data/tasks.jsonl
          num_repeats: 1

policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${oc.env:DIRECTOR_BASE_URL,http://127.0.0.1:18900/v1}
      api_key: ${oc.env:DIRECTOR_API_KEY,EMPTY}
      model: ${oc.env:DIRECTOR_MODEL,RedHatAI/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-FP8}
      return_token_id_information: false
      uses_reasoning_parser: false
      chat_template_kwargs:
        enable_thinking: false
      extra_body:
        reasoning_effort: none
        chat_template_kwargs:
          enable_thinking: false

sherlock_agent:
  responses_api_agents:
    sherlock_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: sherlock
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 6
      weapon_extra_steps: 4
      prompt_config: gym/prompts/system_v1.yaml
      tool_descriptions: verbose
      ablation_id: prompt_v1
      ablation_component: "System Prompt (system_v1 vs system_v2)"
      ablation_description: "Use minimal v1 system prompt without benign-skip or 2-crop weapon rules; hold model, tools (verbose), thinking (off) fixed"
      endpoint_env_var: DIRECTOR_BASE_URL
      director_model_name: ${oc.env:DIRECTOR_MODEL,RedHatAI/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-FP8}
      director_params_b: 30.0
      vlm_model_name: HuggingFaceTB/SmolVLM-500M-Instruct
      vlm_params_b: 0.507
