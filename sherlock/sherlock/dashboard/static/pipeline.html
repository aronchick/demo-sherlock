<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherlock · edge to cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171c23; --panel: #1f2630; --line: #2d3744;
    --ink: #e9edf1; --dim: #8894a3;
    --scout: #6fb1e6; --director: #e8a33d; --tool: #c9cfd6; --analyst: #8fd19e; --verifier: #f08c8c;
    --ok: #8fd19e; --bad: #f08c8c;
    --laptop: rgba(111,177,230,.06); --cloud: rgba(232,163,61,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.4 "IBM Plex Sans", sans-serif; }
  .stage { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr) auto;
    gap: 10px; padding: 12px 14px; }
  header { display: flex; align-items: baseline; gap: 16px; min-width: 0; }
  header h1 { margin: 0; font: 600 22px "IBM Plex Sans Condensed", sans-serif; letter-spacing: .02em; }
  header .sub { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .ratio { margin-left: auto; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  header .ratio b { font: 500 34px/1 "IBM Plex Mono", monospace; color: var(--ink); font-variant-numeric: tabular-nums; }
  header .ratio span { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap: 12px; min-height: 0; }
  .left { display: grid; grid-template-rows: minmax(0,1.7fr) minmax(0,1fr); gap: 12px; min-height: 0; }
  .frame { position: relative; background: #000; border-radius: 8px; overflow: hidden; min-height: 0; border: 1px solid var(--line); }
  .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .frame .tag { position: absolute; left: 10px; top: 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); background: rgba(23,28,35,.7); padding: 3px 7px; border-radius: 4px; }
  .frame .tag i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--scout); margin-right: 6px; vertical-align: 0; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .frame .cover { position: absolute; inset: 0; background: rgba(10,12,15,.88); display: none; align-items: center; justify-content: center;
    color: var(--dim); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .frame.covered .cover { display: flex; }
  #cropFrame img { transition: transform .55s cubic-bezier(.2,.8,.2,1), filter .55s; transform-origin: center; }
  #cropFrame.iris img { transform: scale(1.5); filter: blur(5px); transition: none; }
  #cropFrame.flash::after, #wideFrame.flash::after { content: ""; position: absolute; inset: 0; background: #fff; animation: flash .45s ease-out forwards; pointer-events: none; }
  @keyframes flash { from { opacity: .55; } to { opacity: 0; } }
  .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; font-size: 13px; color: var(--ink);
    background: linear-gradient(transparent, rgba(23,28,35,.92)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s; }
  .caption.on { opacity: 1; }
  .stamp { position: absolute; right: 12px; top: 10px; padding: 4px 10px; border: 2px solid; border-radius: 4px;
    font: 600 12px "IBM Plex Sans Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase;
    opacity: 0; transform: rotate(-8deg) scale(1.6); transition: opacity .25s, transform .25s cubic-bezier(.2,1.4,.4,1); }
  .stamp.on { opacity: 1; transform: rotate(-8deg) scale(1); }
  .stamp.ok { color: var(--ok); border-color: var(--ok); } .stamp.bad { color: var(--bad); border-color: var(--bad); }
  .topo { position: relative; border-radius: 8px; min-height: 0; border: 1px solid var(--line); background: var(--panel); }
  footer { display: flex; align-items: center; gap: 8px; min-width: 0; }
  footer .stat { color: var(--dim); font-size: 12px; white-space: nowrap; }
  footer .stat b { color: var(--ink); font-weight: 500; font-family: "IBM Plex Mono", monospace; }
  footer .sp { flex: 1; }
  footer a { color: var(--dim); font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--line); }
  button { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--director); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--director); outline-offset: 2px; }
  #fx { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Sherlock</h1>
    <div class="sub">one 10 ms model watches everything; the cloud only ever sees a crop</div>
    <div class="ratio"><b id="avoided">0</b><span>VLM calls avoided</span></div>
  </header>
  <main>
    <div class="left">
      <div class="frame" id="wideFrame">
        <img id="wide" src="/stream/wide" alt="Live wide view">
        <span class="tag"><i></i>live · laptop</span>
        <div class="cover">lens covered</div>
      </div>
      <div class="frame" id="cropFrame">
        <img id="crop" src="/stream/crop" alt="Zoomed crop">
        <span class="tag">zoom</span>
        <div class="stamp" id="stamp">confirmed</div>
        <div class="caption" id="caption"></div>
      </div>
    </div>
    <div class="topo" id="topo"></div>
  </main>
  <footer>
    <span class="stat">frames <b id="frames">0</b></span>
    <span class="stat">investigations <b id="investigations">0</b></span>
    <span class="stat">VLM calls <b id="vlm_calls">0</b></span>
    <span class="stat">recovered <b id="recoveries">0</b></span>
    <span class="stat">verified <b id="confirmed">0</b> / <b id="rejected">0</b></span>
    <span class="sp"></span>
    <a href="/">event log</a>
    <button onclick="post('/demo/fail/1')">Break next tool call</button>
    <button id="coverBtn" onclick="toggleCover()">Cover hero lens</button>
  </footer>
</div>
<canvas id="fx"></canvas>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Everything below is driven by the existing SSE stream. Events arrive in bursts
// (mock tools answer in a few ms), so they are turned into "beats" and played
// back at a pace a human can follow. Pixels for the flying cards come from the
// MJPEG <img> elements via drawImage, so what moves through the topology is
// the actual crop the models saw.
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const fx = $('fx'), ctx = fx.getContext('2d');
const wideImg = $('wide'), cropImg = $('crop');
const COLORS = { scout: '#6fb1e6', director: '#e8a33d', analyst: '#8fd19e', verifier: '#f08c8c', bad: '#f08c8c', dim: '#8894a3', ink: '#e9edf1', local: 'rgba(111,177,230,.45)' };

// ---- layout ----------------------------------------------------------------
const NODE_DEFS = [
  { id: 'scout',    side: 'laptop', fx: 0.24, fy: 0.16, label: 'scout',    sub: 'YOLO nano · 10 ms',   color: COLORS.scout },
  { id: 'camera',   side: 'laptop', fx: 0.24, fy: 0.52, label: 'camera',   sub: 'pan · tilt · zoom',    color: COLORS.scout },
  { id: 'director', side: 'cloud',  fx: 0.75, fy: 0.16, label: 'director', sub: 'Nemotron · decides',   color: COLORS.director },
  { id: 'analyst',  side: 'cloud',  fx: 0.75, fy: 0.52, label: 'analyst',  sub: 'VLM · reads the crop', color: COLORS.analyst },
  { id: 'verifier', side: 'cloud',  fx: 0.75, fy: 0.74, label: 'verifier', sub: 'VLM · second opinion', color: COLORS.verifier },
  { id: 'bucket',   side: 'cloud',  fx: 0.75, fy: 0.925, label: 'bucket',  sub: 'S3 · evidence',        color: COLORS.dim, shelf: true },
];
const EDGE_DEFS = {
  frames:  { from: 'camera',   to: 'scout',    bend: 0,    color: COLORS.local },
  uplink:  { from: 'scout',    to: 'director', bend: -0.12, color: COLORS.scout },
  lookat:  { from: 'director', to: 'camera',   bend: 0.18,  color: COLORS.director },
  crop:    { from: 'camera',   to: 'analyst',  bend: 0.10,  color: COLORS.analyst },
  judge:   { from: 'analyst',  to: 'verifier', bend: 0,     color: COLORS.verifier },
  store:   { from: 'verifier', to: 'bucket',   bend: 0,     color: COLORS.dim },
};
const L = { nodes: {}, edges: {}, r: 26, topo: null, divider: 0, shelf: null };

function layout() {
  const dpr = window.devicePixelRatio || 1;
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
  fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = $('topo').getBoundingClientRect();
  L.topo = t;
  L.r = Math.max(18, Math.min(30, t.width * 0.058));
  L.divider = t.left + t.width * 0.495;
  for (const n of NODE_DEFS) L.nodes[n.id] = { ...n, x: t.left + t.width * n.fx, y: t.top + t.height * n.fy, glow: 0, tint: null };
  const b = L.nodes.bucket;
  L.shelf = { w: Math.min(t.width * 0.42, 260), h: L.r * 2.1 };
  b.y = t.top + t.height - L.shelf.h / 2 - 14;
  for (const [k, e] of Object.entries(EDGE_DEFS)) {
    const a = L.nodes[e.from], c = L.nodes[e.to];
    const mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
    const dx = c.x - a.x, dy = c.y - a.y, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;                   // perpendicular
    L.edges[k] = { ...e, ax: a.x, ay: a.y, cx: mx + nx * e.bend * len, cy: my + ny * e.bend * len, bx: c.x, by: c.y, len, hot: 0 };
  }
}
addEventListener('resize', layout);

function edgePoint(e, t) {
  const u = 1 - t;
  return { x: u * u * e.ax + 2 * u * t * e.cx + t * t * e.bx, y: u * u * e.ay + 2 * u * t * e.cy + t * t * e.by };
}
// Trim the path so particles start and end at the node rim, not the centre.
function trimmed(e, t) {
  const pad = (L.r + 4) / e.len;
  return edgePoint(e, pad + t * (1 - 2 * pad));
}

// ---- video geometry ----------------------------------------------------------
// Scout boxes are in wide-frame pixels; the <img> is letterboxed with object-fit.
function imgMap(img) {
  const r = img.getBoundingClientRect();
  const nw = img.naturalWidth || 1280, nh = img.naturalHeight || 720;
  const s = Math.min(r.width / nw, r.height / nh);
  return { s, ox: r.left + (r.width - nw * s) / 2, oy: r.top + (r.height - nh * s) / 2, nw, nh, r };
}
function bboxToPage(img, bb) {
  const m = imgMap(img);
  return { x: m.ox + bb[0] * m.s, y: m.oy + bb[1] * m.s, w: (bb[2] - bb[0]) * m.s, h: (bb[3] - bb[1]) * m.s };
}
// Same zoom rule as FakePTZCamera.bbox_to_pose: the crop is the frame shrunk by the zoom factor.
function zoomWindow(bb, nw, nh) {
  const bw = Math.max(bb[2] - bb[0], 1), bh = Math.max(bb[3] - bb[1], 1);
  const z = Math.max(1, Math.min(4, 0.8 * Math.min(nw / bw, nh / bh)));
  const cw = nw / z, ch = nh / z;
  const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
  const x0 = Math.min(Math.max(cx - cw / 2, 0), nw - cw), y0 = Math.min(Math.max(cy - ch / 2, 0), nh - ch);
  return [x0, y0, x0 + cw, y0 + ch];
}
// Lift pixels off a live stream. Returns a canvas or null if the stream is not up yet.
function grab(img, bb, size = 160) {
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return null;
  let [x1, y1, x2, y2] = bb || [0, 0, nw, nh];
  const padx = (x2 - x1) * 0.15, pady = (y2 - y1) * 0.15;
  x1 = Math.max(0, x1 - padx); y1 = Math.max(0, y1 - pady); x2 = Math.min(nw, x2 + padx); y2 = Math.min(nh, y2 + pady);
  const w = x2 - x1, h = y2 - y1, k = size / Math.max(w, h);
  const c = document.createElement('canvas'); c.width = Math.max(2, Math.round(w * k)); c.height = Math.max(2, Math.round(h * k));
  try { c.getContext('2d').drawImage(img, x1, y1, w, h, 0, 0, c.width, c.height); } catch (e) { return null; }
  return c;
}

// ---- animated state ----------------------------------------------------------
const S = {
  particles: [], cards: [], bursts: [], shelf: [],
  box: null,          // { bb, color, alpha } on the wide feed
  zoom: null,         // { from, to, t } zoom window animating on the wide feed
  flash: 0, sweep: 0, frames: 0, tick: 0, ambient: 0.6,
  latency: {},        // node id -> { ms, t }
};
const now = () => performance.now();
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

function flow(edge, ms, color) {
  const e = L.edges[edge];
  e.hot = Math.max(e.hot, now() + ms);
  if (color) e.tint = color;
  // seed immediately so the stream reads as a burst, not a trickle
  for (let i = 0; i < 6; i++) spawnParticle(e, Math.random() * 0.15);
}
function spawnParticle(e, t0 = 0) {
  S.particles.push({ e, t: t0, v: 0.0045 + Math.random() * 0.004, j: (Math.random() - .5) * 10, size: 1.2 + Math.random() * 1.8, a: 1 });
}
function burst(x, y, color, n = 26) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3;
    S.bursts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, a: 1, color, size: 1.5 + Math.random() * 2 });
  }
}
function glow(id, amount = 1, tint) { const n = L.nodes[id]; n.glow = Math.max(n.glow, amount); if (tint) n.tint = tint; }
function latency(id, ms) { if (ms) S.latency[id] = { ms: Math.round(ms), t: now() }; }

// A card is a bitmap travelling through a list of page-space waypoints.
function sendCard(bitmap, points, ms, opts = {}) {
  return new Promise(res => {
    S.cards.push({ bmp: bitmap, pts: points, t0: now(), ms, w: opts.w || 64, done: res, stamp: opts.stamp || null, color: opts.color || COLORS.ink });
  });
}
function nodeXY(id) { const n = L.nodes[id]; return { x: n.x, y: n.y }; }
function centerOf(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

// ---- beats: the choreography queue --------------------------------------------
const Q = []; let playing = false;
function beat(fn) { Q.push(fn); if (!playing) drain(); }
async function drain() {
  playing = true;
  while (Q.length) { try { await Q.shift()(); } catch (e) { console.error(e); } }
  playing = false;
}
const wait = ms => new Promise(r => setTimeout(r, ms));

let current = { card: null, bb: null, cropBmp: null, verdict: null };

function onScout(ev) {
  const bb = ev.data.bbox;
  beat(async () => {
    current = { card: grab(wideImg, bb), bb, cropBmp: null, verdict: null };
    S.box = { bb, color: COLORS.scout, alpha: 1 };
    S.zoom = null;
    S.flash = 1; $('wideFrame').classList.remove('flash'); void $('wideFrame').offsetWidth; $('wideFrame').classList.add('flash');
    $('stamp').classList.remove('on'); $('caption').classList.remove('on');
    const p = bboxToPage(wideImg, bb);
    glow('scout', 1); latency('scout', ev.latency_ms);
    await sendCard(current.card, [{ x: p.x + p.w / 2, y: p.y + p.h / 2 }, nodeXY('scout')], 650, { w: 72 });
    burst(L.nodes.scout.x, L.nodes.scout.y, COLORS.scout, 14);
  });
  beat(async () => {                       // only the crop crosses the line
    flow('uplink', 900, COLORS.scout);
    glow('director', 0.6);
    await sendCard(current.card, [nodeXY('scout'), edgePoint(L.edges.uplink, 0.5), nodeXY('director')], 950, { w: 56 });
    glow('director', 1);
  });
}
function onDirector(ev) {
  const m = ev.msg || '';
  beat(async () => {
    glow('director', 1); latency('director', ev.latency_ms);
    if (/failed, trying next|unreachable|budget/i.test(m)) burst(L.nodes.director.x, L.nodes.director.y, COLORS.bad, 20);
    await wait(/->|look_at|snapshot/i.test(m) ? 350 : 500);
  });
}
function onTool(ev) {
  const m = ev.msg || '';
  if (/FAILED|error/i.test(m)) {
    beat(async () => {
      const where = /snapshot/.test(m) ? 'analyst' : 'camera';
      const e = /snapshot/.test(m) ? L.edges.crop : L.edges.lookat;
      const p = edgePoint(e, 0.55);
      burst(p.x, p.y, COLORS.bad, 40);
      glow(where, 1, COLORS.bad);
      if (S.box) S.box.color = COLORS.bad;
      await wait(800);
      if (S.box) S.box.color = COLORS.scout;
      L.nodes[where].tint = null;
    });
    return;
  }
  if (/^look_at/.test(m)) {
    beat(async () => {                     // instruction comes back down; the camera obeys
      flow('lookat', 800, COLORS.director);
      latency('camera', ev.latency_ms);
      await wait(380);
      glow('camera', 1, COLORS.director);
      const m2 = imgMap(wideImg);
      const bb = (ev.data && ev.data.bbox) || current.bb;
      if (bb) S.zoom = { from: [0, 0, m2.nw, m2.nh], to: zoomWindow(bb, m2.nw, m2.nh), t0: now(), ms: 700 };
      const cf = $('cropFrame');
      cf.classList.add('iris'); void cf.offsetWidth; cf.classList.remove('iris');
      await wait(600);
    });
  }
  if (/^snapshot/.test(m)) latency('camera', ev.latency_ms);
}
function onAnalyst(ev) {
  beat(async () => {                       // the zoomed crop is the second (and last) thing to leave the laptop
    current.cropBmp = grab(cropImg, null, 200) || current.card;
    const cf = $('cropFrame'); cf.classList.remove('flash'); void cf.offsetWidth; cf.classList.add('flash');
    await sendCard(current.cropBmp, [centerOf(cropImg), nodeXY('camera')], 500, { w: 72 });
    flow('crop', 900, COLORS.analyst);
    glow('analyst', 0.6);
    await sendCard(current.cropBmp, [nodeXY('camera'), edgePoint(L.edges.crop, 0.5), nodeXY('analyst')], 900, { w: 60 });
    glow('analyst', 1); latency('analyst', ev.latency_ms);
    const cap = $('caption'); cap.textContent = ev.msg; cap.classList.add('on');
    await wait(650);
  });
}
function onVerifier(ev) {
  const ok = /^CONFIRMED/.test(ev.msg || '');
  beat(async () => {
    flow('judge', 700, COLORS.verifier);
    await sendCard(current.cropBmp || current.card, [nodeXY('analyst'), nodeXY('verifier')], 700, { w: 56 });
    current.verdict = ok;
    glow('verifier', 1, ok ? COLORS.analyst : COLORS.bad); latency('verifier', ev.latency_ms);
    burst(L.nodes.verifier.x, L.nodes.verifier.y, ok ? COLORS.analyst : COLORS.bad, ok ? 18 : 34);
    const st = $('stamp'); st.textContent = ok ? 'confirmed' : 'rejected'; st.className = 'stamp on ' + (ok ? 'ok' : 'bad');
    await wait(700);
    L.nodes.verifier.tint = null;
  });
}
function onReport(ev) {
  beat(async () => {
    flow('store', 700, COLORS.dim);
    const bmp = current.cropBmp || current.card;
    const b = L.nodes.bucket;
    const slot = shelfSlot(Math.min(S.shelf.length, 7));
    await sendCard(bmp, [nodeXY('verifier'), { x: slot.x, y: slot.y }], 750, { w: 48, stamp: current.verdict });
    S.shelf.push({ bmp, ok: current.verdict });
    if (S.shelf.length > 8) S.shelf.shift();
    latency('bucket', ev.latency_ms);
    const cap = $('caption');
    if (ev.data && ev.data.claim) { cap.textContent = ev.data.claim; cap.classList.add('on'); }
    burst(slot.x, slot.y, COLORS.dim, 10);
    await wait(500);
    if (S.box) S.box.alpha = 0; S.zoom = null;
  });
}
function shelfSlot(i) {
  const b = L.nodes.bucket, sh = L.shelf, cell = (sh.w - 16) / 8;
  return { x: b.x - sh.w / 2 + 8 + cell * i + cell / 2, y: b.y, w: cell - 4, h: sh.h - 14 };
}

// ---- SSE ----------------------------------------------------------------------
const es = new EventSource('/events');
es.onmessage = e => {
  const ev = JSON.parse(e.data);
  const m = ev.msg || '';
  switch (ev.stage) {
    case 'scout': return onScout(ev);
    case 'director': return onDirector(ev);
    case 'tool': return onTool(ev);
    case 'analyst': return onAnalyst(ev);
    case 'verifier': return onVerifier(ev);
    case 'system':
      if (m.startsWith('REPORT')) return onReport(ev);
      if (/covered$/.test(m) && /^hero /.test(m)) $('wideFrame').classList.toggle('covered', !/uncovered/.test(m));
      if (/will fail/.test(m)) { glow('camera', 1, COLORS.bad); setTimeout(() => L.nodes.camera.tint = null, 1200); }
      return;
  }
};
let lastFrames = 0;
es.addEventListener('stats', e => {
  const s = JSON.parse(e.data);
  for (const k in s) { const el = $(k); if (el) el.textContent = s[k]; }
  $('avoided').textContent = s.vlm_calls_avoided;
  const d = s.frames - lastFrames; lastFrames = s.frames;
  S.ambient = Math.min(1.4, 0.2 + d / 20);     // more frames per tick, denser local stream
  S.frames = s.frames;
});
const post = url => fetch(url, { method: 'POST' });
let covered = false;
async function toggleCover() {
  covered = !covered;
  await post(`/demo/cover/hero/${covered ? 'on' : 'off'}`);
  $('coverBtn').textContent = covered ? 'Uncover hero lens' : 'Cover hero lens';
}

// ---- render loop ----------------------------------------------------------------
function roundRect(x, y, w, h, r) {

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawCardImage(bmp, cx, cy, w, color, alpha = 1) {

  ctx.strokeStyle = color; ctx.lineWidth = 1.2; roundRect(cx - w / 2 - 2, cy - h / 2 - 2, w + 4, h + 4, 4); ctx.stroke();
  ctx.restore();

}
function drawTopo(t) {
  const T = L.topo, r = L.r;

  ctx.fillStyle = 'rgba(111,177,230,.045)'; roundRect(T.left + 1, T.top + 1, L.divider - T.left - 1, T.height - 2, 8); ctx.fill();
  ctx.fillStyle = 'rgba(232,163,61,.045)'; roundRect(L.divider, T.top + 1, T.right - L.divider - 1, T.height - 2, 8); ctx.fill();
  ctx.setLineDash([3, 6]); ctx.strokeStyle = 'rgba(233,237,241,.28)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(L.divider, T.top + 10); ctx.lineTo(L.divider, T.bottom - 10); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '600 10px "IBM Plex Sans"'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = COLORS.dim;
  ctx.fillText('L A P T O P', (T.left + L.divider) / 2, T.top + 10);
  ctx.fillText('C L O U D', (L.divider + T.right) / 2, T.top + 10);
  ctx.save(); ctx.translate(L.divider, (T.top + T.bottom) / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = 'rgba(233,237,241,.4)'; ctx.font = '500 9px "IBM Plex Mono"';
  ctx.fillText('crops only · never the frame', 0, -4); ctx.restore();

  // edges
  for (const e of Object.values(L.edges)) {
    const hot = e.hot > t;
    ctx.strokeStyle = hot ? e.tint || e.color : 'rgba(233,237,241,.09)'; ctx.lineWidth = hot ? 1.4 : 1;
    ctx.globalAlpha = hot ? 0.55 : 1;
    ctx.beginPath(); const p0 = trimmed(e, 0); ctx.moveTo(p0.x, p0.y);
    for (let i = 1; i <= 24; i++) { const p = trimmed(e, i / 24); ctx.lineTo(p.x, p.y); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // particles
  for (const p of S.particles) {
    const q = trimmed(p.e, p.t);
    const dx = p.e.bx - p.e.ax, dy = p.e.by - p.e.ay, len = Math.hypot(dx, dy) || 1;
    const px = q.x + (-dy / len) * p.j * Math.sin(p.t * 6), py = q.y + (dx / len) * p.j * Math.sin(p.t * 6);
    ctx.globalAlpha = Math.min(1, p.a) * (1 - Math.abs(p.t - 0.5) * 0.4);
    ctx.fillStyle = p.e.tint || p.e.color; ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // nodes
  ctx.textAlign = 'center';
  for (const n of Object.values(L.nodes)) {
    const col = n.tint || n.color;
    if (n.shelf) { drawShelf(n, col); continue; }
    if (n.glow > 0.01) {
      const g = ctx.createRadialGradient(n.x, n.y, r * 0.6, n.x, n.y, r * 2.4);
      g.addColorStop(0, hexA(col, 0.35 * n.glow)); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, r * 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#141920'; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1.5 + n.glow * 1.5; ctx.globalAlpha = 0.55 + n.glow * 0.45; ctx.stroke(); ctx.globalAlpha = 1;
    if (n.id === 'scout') {                  // the always-on model: a sweep hand that never stops
      const a = (t / 900) % (Math.PI * 2) * 1;
      ctx.strokeStyle = COLORS.scout; ctx.lineWidth = 2; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(n.x, n.y, r - 5, a, a + 0.9); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = COLORS.ink; ctx.font = '500 10px "IBM Plex Mono"'; ctx.textBaseline = 'middle';
      ctx.fillText(String(S.frames), n.x, n.y + 1);
    } else if (n.id === 'camera') {
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.42, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.16, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    } else {                                   // a model: three quiet bars that light up when it thinks
      for (let i = -1; i <= 1; i++) {
        const h = r * (0.35 + (n.glow > 0.05 ? 0.35 * Math.abs(Math.sin(t / 140 + i)) : 0.15 * (1 + i * 0.3)));
        ctx.fillStyle = hexA(col, 0.5 + n.glow * 0.5); ctx.fillRect(n.x + i * 7 - 2, n.y - h / 2, 4, h);
      }
    }
    ctx.fillStyle = COLORS.ink; ctx.font = '600 11px "IBM Plex Sans"'; ctx.textBaseline = 'top';
    ctx.fillText(n.label.toUpperCase(), n.x, n.y + r + 7);
    ctx.fillStyle = COLORS.dim; ctx.font = '10px "IBM Plex Sans"'; ctx.fillText(n.sub, n.x, n.y + r + 21);
    const lat = S.latency[n.id];
    if (lat && t - lat.t < 4000) {
      ctx.globalAlpha = Math.min(1, (4000 - (t - lat.t)) / 800);
      ctx.fillStyle = col; ctx.font = '500 10px "IBM Plex Mono"'; ctx.textBaseline = 'top';
      ctx.fillText((lat.ms < 1 ? '<1' : lat.ms) + ' ms', n.x, n.y + r + 35); ctx.globalAlpha = 1;
    }
    n.glow *= 0.965;
  }
  ctx.restore();
}
function drawShelf(n, col) {
  const sh = L.shelf, x = n.x - sh.w / 2, y = n.y - sh.h / 2;
  ctx.fillStyle = '#141920'; roundRect(x, y, sh.w, sh.h, 6); ctx.fill();
  ctx.strokeStyle = hexA(COLORS.dim, 0.7 + n.glow * 0.3); ctx.lineWidth = 1.5; ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const s = shelfSlot(i), item = S.shelf[i];
    if (item && item.bmp) {
      const k = Math.min(s.w / item.bmp.width, s.h / item.bmp.height);
      const w = item.bmp.width * k, h = item.bmp.height * k;
      ctx.drawImage(item.bmp, s.x - w / 2, s.y - h / 2, w, h);
      ctx.strokeStyle = item.ok ? COLORS.analyst : COLORS.bad; ctx.lineWidth = 1; ctx.strokeRect(s.x - w / 2, s.y - h / 2, w, h);
    } else {
      ctx.strokeStyle = 'rgba(233,237,241,.08)'; ctx.setLineDash([2, 3]); ctx.strokeRect(s.x - s.w / 2, s.y - s.h / 2, s.w, s.h); ctx.setLineDash([]);
    }
  }
  ctx.fillStyle = COLORS.ink; ctx.font = '600 11px "IBM Plex Sans"'; ctx.textBaseline = 'bottom'; ctx.textAlign = 'left';
  ctx.fillText(n.label.toUpperCase(), x, y - 6);
  ctx.fillStyle = COLORS.dim; ctx.font = '10px "IBM Plex Sans"'; ctx.textAlign = 'right';
  ctx.fillText(n.sub, x + sh.w, y - 6); ctx.textAlign = 'center';
  n.glow *= 0.965;
}
function drawFeed(t) {
  const m = imgMap(wideImg), R = m.r;
  if (!R.width) return;
  ctx.save(); ctx.beginPath(); ctx.rect(R.left, R.top, R.width, R.height); ctx.clip();
  // the sweep: a soft band that says "every frame is being looked at"
  const sy = R.top + ((t / 2800) % 1) * (R.height + 80) - 40;
  const g = ctx.createLinearGradient(0, sy - 40, 0, sy + 40);
  g.addColorStop(0, 'rgba(111,177,230,0)'); g.addColorStop(0.5, 'rgba(111,177,230,.09)'); g.addColorStop(1, 'rgba(111,177,230,0)');
  ctx.fillStyle = g; ctx.fillRect(R.left, sy - 40, R.width, 80);
  // viewfinder corners
  ctx.strokeStyle = 'rgba(233,237,241,.35)'; ctx.lineWidth = 1.5; const c = 14, pad = 10;
  for (const [x, y, sx, sy2] of [[R.left + pad, R.top + pad, 1, 1], [R.right - pad, R.top + pad, -1, 1], [R.left + pad, R.bottom - pad, 1, -1], [R.right - pad, R.bottom - pad, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy2 * c); ctx.lineTo(x, y); ctx.lineTo(x + sx * c, y); ctx.stroke();
  }
  // zoom window converging on the target
  if (S.zoom) {
    const k = easeOut(Math.min(1, (t - S.zoom.t0) / S.zoom.ms));
    const bb = S.zoom.from.map((v, i) => v + (S.zoom.to[i] - v) * k);
    const p = bboxToPage(wideImg, bb);
    ctx.setLineDash([6, 5]); ctx.strokeStyle = COLORS.director; ctx.lineWidth = 1.5; ctx.strokeRect(p.x, p.y, p.w, p.h); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(R.left, R.top, R.width, p.y - R.top); ctx.fillRect(R.left, p.y + p.h, R.width, R.bottom - p.y - p.h);
    ctx.fillRect(R.left, p.y, p.x - R.left, p.h); ctx.fillRect(p.x + p.w, p.y, R.right - p.x - p.w, p.h);
  }

  if (S.box && S.box.alpha > 0.01) {
    const p = bboxToPage(wideImg, S.box.bb);
    ctx.globalAlpha = S.box.alpha; ctx.strokeStyle = S.box.color; ctx.lineWidth = 2;
    const pulse = 1 + 0.03 * Math.sin(t / 120);
    const w = p.w * pulse, h = p.h * pulse, x = p.x + (p.w - w) / 2, y = p.y + (p.h - h) / 2;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = hexA(S.box.color, 0.12); ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
    if (S.box.alpha < 1) S.box.alpha *= 0.9;
  }
  ctx.restore();
}
function hexA(hex, a) {
  if (hex.startsWith('rgba')) return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function step(t) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  // ambient: frames pouring from the camera into the scout, forever, never crossing the line
  if (Math.random() < S.ambient * 0.35) spawnParticle(L.edges.frames);
  for (const e of Object.values(L.edges)) if (e.hot > t && Math.random() < 0.6) spawnParticle(e);
  for (const p of S.particles) p.t += p.v;
  S.particles = S.particles.filter(p => p.t < 1);
  if (S.particles.length > 600) S.particles.splice(0, S.particles.length - 600);
  for (const b of S.bursts) { b.x += b.vx; b.y += b.vy; b.vx *= 0.93; b.vy *= 0.93; b.a -= 0.025; }
  S.bursts = S.bursts.filter(b => b.a > 0);

  drawFeed(t);
  drawTopo(t);
  for (const b of S.bursts) { ctx.globalAlpha = b.a; ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  // cards on top of everything
  for (const c of S.cards) {
    const k = ease(Math.min(1, (t - c.t0) / c.ms));
    const segs = c.pts.length - 1, f = k * segs, i = Math.min(segs - 1, Math.floor(f)), u = f - i;
    const a = c.pts[i], b = c.pts[i + 1];
    const x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u;
    const scale = 1 - 0.25 * Math.sin(k * Math.PI);          // shrinks mid-flight: it is leaving
    const h = drawCardImage(c.bmp, x, y, c.w * scale, c.color);

      ctx.strokeStyle = c.stamp ? COLORS.analyst : COLORS.bad; ctx.lineWidth = 2; ctx.strokeRect(x - c.w * scale / 2, y - h / 2, c.w * scale, h);
    }

  }
  S.cards = S.cards.filter(c => !c.finished);
  requestAnimationFrame(step);
}
layout();
requestAnimationFrame(step);
